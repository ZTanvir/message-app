name: Continue integration client
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize]
    paths:
      - "client/**"
  push:
    branches:
      - main
    paths:
      - "client/**"

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
        working-directory: ./client
      - name: Check style
        run: npm run lint
        working-directory: ./client
      - name: Build react app
        run: npm run build
        working-directory: ./client
